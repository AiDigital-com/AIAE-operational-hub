name: DEV GitOps Deploy On Push

on:
  push:
    branches:
      - "*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: operational-hub-gitops-deploy
  cancel-in-progress: false

env:
  API_IMAGE: aidigital.aiae-projects/operational-hub-application

jobs:
  deploy:
    if: github.ref_name == vars.DEV_DEPLOY_BRANCH
    name: Build images and update GitOps revisions
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      FRONTEND_DISTRIBUTION_ID: ${{ vars.FRONTEND_DISTRIBUTION_ID }}
      APP_CONFIG_SECRET_NAME: ${{ vars.APP_CONFIG_SECRET_NAME }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          required=(
            AWS_ROLE_TO_ASSUME
            AWS_REGION
            FRONTEND_BUCKET
            FRONTEND_DISTRIBUTION_ID
            APP_CONFIG_SECRET_NAME
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub environment variable: ${name}"
              exit 1
            fi
          done

      - name: Resolve deployment environment
        id: deploy-env
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Automatic DEV deployment requires an X.Y.Z branch"
            exit 1
          fi

          image_tag="${GITHUB_REF_NAME}-snapshot-${GITHUB_SHA::12}"
          {
            echo "name=dev"
            echo "image_tag=${image_tag}"
            echo "liquibase_tag=liquibase-${image_tag}"
            echo "deployment_revision=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Load frontend configuration
        shell: bash
        run: |
          config=$(aws secretsmanager get-secret-value \
            --secret-id "$APP_CONFIG_SECRET_NAME" \
            --query SecretString \
            --output text)
          clerk_publishable_key=$(jq -r '.CLERK_PUBLISHABLE_KEY // empty' <<<"$config")
          if [ -z "$clerk_publishable_key" ]; then
            echo "::error::CLERK_PUBLISHABLE_KEY is missing from $APP_CONFIG_SECRET_NAME"
            exit 1
          fi
          echo "::add-mask::$clerk_publishable_key"
          echo "CLERK_PUBLISHABLE_KEY=$clerk_publishable_key" >> "$GITHUB_ENV"

      - name: Verify Terraform-managed ECR repository
        run: aws ecr describe-repositories --repository-names "$API_IMAGE" >/dev/null

      - name: Check immutable image tags
        id: image-tags
        shell: bash
        run: |
          application_exists=false
          liquibase_exists=false

          if [ "$(aws ecr batch-get-image \
            --repository-name "$API_IMAGE" \
            --image-ids imageTag="${{ steps.deploy-env.outputs.image_tag }}" \
            --query 'length(images)' \
            --output text)" = "1" ]; then
            application_exists=true
          fi

          if [ "$(aws ecr batch-get-image \
            --repository-name "$API_IMAGE" \
            --image-ids imageTag="${{ steps.deploy-env.outputs.liquibase_tag }}" \
            --query 'length(images)' \
            --output text)" = "1" ]; then
            liquibase_exists=true
          fi

          {
            echo "application_exists=${application_exists}"
            echo "liquibase_exists=${liquibase_exists}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        if: steps.image-tags.outputs.application_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.API_IMAGE }}:${{ steps.deploy-env.outputs.image_tag }}

      - name: Build and push Liquibase image
        if: steps.image-tags.outputs.liquibase_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Liquibase.Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.API_IMAGE }}:${{ steps.deploy-env.outputs.liquibase_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ env.CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_JWT_TEMPLATE: aidigital-api
        run: |
          npm ci
          npm run build

      - name: Deploy frontend assets
        shell: bash
        run: |
          aws s3 sync frontend/dist "s3://${FRONTEND_BUCKET}" \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp frontend/dist/index.html "s3://${FRONTEND_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
          aws cloudfront create-invalidation \
            --distribution-id "${FRONTEND_DISTRIBUTION_ID}" \
            --paths "/*" >/dev/null

      - name: Checkout versions repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_VERSIONS_REPOSITORY }}
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-versions

      - name: Update DEV image versions
        uses: mikefarah/yq@v4.45.1
        env:
          IMAGE_TAG: ${{ steps.deploy-env.outputs.image_tag }}
          LIQUIBASE_TAG: ${{ steps.deploy-env.outputs.liquibase_tag }}
          DEPLOYMENT_REVISION: ${{ steps.deploy-env.outputs.deployment_revision }}
        with:
          cmd: >-
            yq -i
            '.image.tag = strenv(IMAGE_TAG) |
            .image.pullPolicy = "IfNotPresent" |
            .liquibase.image.tag = strenv(LIQUIBASE_TAG) |
            .liquibase.image.pullPolicy = "IfNotPresent" |
            .deploymentRevision = strenv(DEPLOYMENT_REVISION)'
            gitops-versions/operational-hub-api/values.yaml

      - name: Commit versions update
        id: versions
        working-directory: gitops-versions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operational-hub-api/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "[operational-hub-api][${{ steps.deploy-env.outputs.image_tag }}]"
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout Helm environment branch
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_HELM_REPOSITORY }}
          ref: ${{ steps.deploy-env.outputs.name }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-helm

      - name: Pin versions revision in environment
        uses: mikefarah/yq@v4.45.1
        env:
          VERSIONS_REVISION: ${{ steps.versions.outputs.revision }}
        with:
          cmd: >-
            yq -i
            '.source.operationalHubVersionsRevision = strenv(VERSIONS_REVISION)'
            gitops-helm/aiae/values.yaml

      - name: Commit environment revision
        working-directory: gitops-helm
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aiae/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "[operational-hub-api][${{ steps.deploy-env.outputs.image_tag }}]"
            git push origin HEAD:${{ steps.deploy-env.outputs.name }}
          fi
