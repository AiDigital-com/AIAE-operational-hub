  /api/v1/campaigns/{campaignId}/report-rows/adjustments/rollback:
    post:
      tags:
        - campaigns
      operationId: rollbackAdjustments
      description: >
        Removes the Operational Hub's own manual adjustments (delivery and conversions) for the given
        level-1 campaign names, confined to the given inclusive date window - never all-time. An
        adjustment is a separate overlay row over the immutable platform_mart/conversions_mart facts, so
        a rollback deletes the overlay row and restores nothing: the read view falls back to the
        underlying mart figure on its own once the overlay is gone. The MDA spreadsheet tool's own
        adjustment tables are never touched, so a row it adjusted keeps showing after this call. POST
        (not DELETE) because the scope travels in the body and DELETE-with-body is handled inconsistently
        by proxies and generators. Requested names are matched case-insensitively (as the MDA tool does)
        against the campaign's resolved delivery scope; a name outside that scope fails the whole
        request rather than being silently skipped.
      parameters:
        - name: campaignId
          in: path
          required: true
          description: The campaign id.
          schema:
            type: integer
            format: int64
      requestBody:
        description: The level-1 campaign names and date window to roll back adjustments for.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRowAdjustmentRollbackRequestV1'
      responses:
        '200':
          description: The adjustments were removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRowAdjustmentRollbackResultV1'
        '400':
          description: The request body failed validation, or a requested name is outside this campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
