      operationId: uploadConversionAdjustments
      description: >
        Applies an uploaded, edited conversions .xlsx (from .../conversions/adjustments/template): each
        row is matched to a current conversions row by date, the three level ids, the conversion action
        and its category, and a row whose `conversions` figure differs is written as an adjustment.
