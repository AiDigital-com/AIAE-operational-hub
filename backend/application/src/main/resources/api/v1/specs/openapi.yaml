    ReportRowTotalsV1:
      type: object
      description: >
        Metric totals across every report row matching the query - always computed over the full
        filtered dataset, not just the current page.
      properties:
        impressions:
          type: integer
          format: int64
          description: Summed delivered impressions, or null.
        clicks:
          type: integer
          format: int64
          description: Summed delivered clicks, or null.
        spend:
          type: number
          format: double
          description: Summed delivered spend, or null.
        starts:
          type: integer
          format: int64
          description: Summed video starts, or null.
        first_quartiles:
          type: integer
          format: int64
          description: Summed video first-quartile completions, or null.
        midpoints:
          type: integer
          format: int64
          description: Summed video midpoint completions, or null.
        third_quartiles:
          type: integer
          format: int64
          description: Summed video third-quartile completions, or null.
        completes:
          type: integer
          format: int64
          description: Summed video completions, or null.
        conversions:
          type: number
          format: double
          description: Summed conversions, or null.
        post_click_conversions:
          type: number
          format: double
          description: Summed post-click conversions, or null.
        post_view_conversions:
          type: number
          format: double
          description: Summed post-view conversions, or null.
        dynamic_cost:
          type: number
          format: double
          description: Summed rate-card (dynamic) cost, or null.
        link_clicks:
          type: integer
          format: int64
          description: Summed link clicks, or null.
        dynamic_rate:
          type: number
          format: double
          description: >
            Rate-card (dynamic) rate over the whole set: summed dynamic cost per summed billable unit
            (thousands of impressions on CPM, clicks on CPC, starts on CPV), not an average of the
            rows' own rates. Null when the set has no billable units.
        avg_dynamic_rate_by_date_tactic:
          type: number
          format: double
          description: >
            "Average dynamic rate by date/tactic", weighted by each row's billable units, or null.
        cpm:
          type: number
          format: double
          description: Derived spend / impressions * 1000, or null when impressions is zero.
        ivt:
          type: number
          format: double
          description: >
            Summed modelled invalid traffic, as a count of impressions - not measured, and null on channels that report their own (Meta, TikTok, the search channels) or have no click to reason from (CTV, DOOH, Live Sports). Derived from a ~5% benchmark spread deterministically across ten coefficients, so the same row always yields the same figure.
        cpc:
          type: number
          format: double
          description: Derived spend / clicks, or null when clicks is zero.
        cpv:
          type: number
          format: double
          description: >
            Derived spend / starts, or null when starts is zero. A view is counted as a start, the
            same denominator the source view's own CPV rate uses.
        ctr:
          type: number
          format: double
          description: Derived clicks / impressions * 100, or null when impressions is zero.
        avcr:
          type: number
          format: double
          description: Derived completes / impressions * 100, or null when impressions is zero.
    ReportRowsPageResponseV1:
      type: object
      description: >
        A page of report rows plus full-dataset aggregates (totals, date range, row count, distinct
        line item count) that stay stable while more pages load. Carries no total *page* count - unlike
        PageResponseV1-based pages, hasNext is derived from fetching one row past the page size, so
        paging further is cheap regardless of how large the result set is. total_rows is reported
        alongside it as a label, from a window function on the page's own query.
      properties:
        pageNumber:
          type: integer
          format: int32
          description: One-based number of the returned page.
        pageSize:
          type: integer
          format: int32
          description: Maximum number of items per page.
        hasNext:
          type: boolean
          description: Whether at least one more row exists past this page.
        content:
          type: array
          description: The report rows on this page.
          items:
            $ref: '#/components/schemas/ReportRowV1'
        totals:
          $ref: '#/components/schemas/ReportRowTotalsV1'
        min_date:
          type: string
          description: Earliest date across every matching row (ISO format), or null.
        max_date:
          type: string
          description: Latest date across every matching row (ISO format), or null.
        total_rows:
          type: integer
          format: int64
          description: >
            How many rows the query matches in total - the number of groups when the request groups by
            dimensions. An aggregate for the table to label itself with, not a paging mechanism: paging
            stays driven by hasNext, and this rides on the data query as a window function rather than
            costing a count job of its own.
        distinct_line_item_count:
          type: integer
          format: int64
          description: Number of distinct line items across every matching row.
      required:
        - pageNumber
        - pageSize
        - hasNext
        - content
        - totals
        - distinct_line_item_count
