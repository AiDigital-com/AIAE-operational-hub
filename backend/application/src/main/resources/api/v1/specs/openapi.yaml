      properties:
        id:
          type: integer
          format: int64
          description: BigQuery client/advertiser id from the IO Lines source.
        name:
          type: string
          description: Client company name, may be null when the source row has no advertiser name.
      required:
        - id
    ClientV1:
      type: object
      description: Representation of a client sourced from BigQuery.
      properties:
        id:
