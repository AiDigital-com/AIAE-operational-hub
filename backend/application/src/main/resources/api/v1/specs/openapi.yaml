      properties:
        id:
          type: integer
          format: int64
          description: Internal hub_scope_types.id.
        scope_code:
          type: string
          description: Stable scope code defining how role assignment scope_id is interpreted.
        display_name:
          type: string
          description: Human-readable scope type name.
        description:
          type: string
          description: Human-readable scope type description.
        status:
          type: string
          description: Current scope-type dictionary status.
      required:
        - id
        - scope_code
        - display_name
        - status
    StatusV1:
      type: object
      description: A lifecycle status dictionary row.
      properties:
