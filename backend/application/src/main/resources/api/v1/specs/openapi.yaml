          format: int64
          description: BigQuery client/advertiser id from the IO Lines source.
        name:
          type: string
          description: Client company name.
        agency_id:
          type: integer
          format: int64
          description: BigQuery agency id of the owning agency, or null when unparented.
        email:
          type: string
          description: Client primary email (not available from BigQuery).
        status:
