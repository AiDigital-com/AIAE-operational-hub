            type: string
        filters:
          type: array
          description: The saved per-dimension multi-value filters (US-029); empty when none.
          items:
            $ref: '#/components/schemas/ReportRowFilterV1'
        columnOrder:
          type: array
          description: >
            Column ids in the order they should be shown, once someone has dragged them. Absent means no
            preference was expressed and the product's canonical order applies - which is not the same as
            the order of `dimensions`/`metrics`, since those carry the order the columns were selected in.
            Ids not listed here fall in behind the ones that are, in canonical order.
          items:
            type: string
      required:
        - id
        - campaignId
        - name
        - type
        - status
        - created
        - dimensions
        - metrics
    ReportViewUpsertV1:
      type: object
      description: >
        Data to create or fully replace a report view. The campaign comes from the path; id and
        created/edited timestamps are server-owned.
      properties:
        name:
          type: string
          maxLength: 50
          description: The report name; validated non-empty, at most 50 characters, and unique within the campaign.
        type:
          $ref: '#/components/schemas/ReportViewTypeEnumV1'
        status:
          $ref: '#/components/schemas/ReportViewStatusEnumV1'
        note:
          type: string
          description: An optional free-text note.
        dimensions:
          type: array
          items:
            type: string
        metrics:
          type: array
          items:
            type: string
        filters:
          type: array
          description: The saved per-dimension multi-value filters (US-029); empty when none.
          items:
            $ref: '#/components/schemas/ReportRowFilterV1'
        columnOrder:
          type: array
          description: >
            Column ids in the order they should be shown, once someone has dragged them. Absent means no
            preference was expressed and the product's canonical order applies - which is not the same as
            the order of `dimensions`/`metrics`, since those carry the order the columns were selected in.
            Ids not listed here fall in behind the ones that are, in canonical order.
          items:
            type: string
      required:
        - name
        - type
        - status
        - dimensions
        - metrics
    ReportViewPageResponseV1:
      description: A page of saved report views.
      allOf:
        - $ref: '#/components/schemas/PageResponseV1'
        - type: object
          properties:
            content:
              type: array
              description: The report views on this page.
              items:
                $ref: '#/components/schemas/ReportViewV1'
          required:
            - content
    DashboardTypeEnumV1:
      type: string
      description: >
        The dashboard type, which is also the schema of its data source: it decides which dimensions and
        metrics the BigQuery table carries. The other types the product plans - Conversions, Geo, Keywords,
        Business outcomes, Live Sports, Device, Genre, Demographics - are listed in the UI as coming soon
        (US-016) and deliberately absent here: a type with no schema behind it would let a dashboard be
        created that nothing can write.
      enum:
        - basic
    DashboardStatusEnumV1:
      type: string
      description: >
        Whether a data source exists for the dashboard. A dashboard is a draft until its BigQuery table has
        been written and live once it has; this is a reading of `sourceTable`, not an independent state.
      enum:
        - draft
        - live
    DashboardV1:
      type: object
      description: A dashboard definition scoped to one campaign, and the BigQuery data source it points at (US-017).
      properties:
        id:
          type: integer
          format: int64
          description: The dashboard id.
        campaignId:
          type: integer
          format: int64
          description: The id of the campaign this dashboard belongs to.
        name:
          type: string
          maxLength: 50
          description: The dashboard name, unique within the campaign.
        type:
          $ref: '#/components/schemas/DashboardTypeEnumV1'
        status:
          $ref: '#/components/schemas/DashboardStatusEnumV1'
        optionalColumns:
          type: array
          description: >
            Ids of the type's optional columns the user kept - exactly those, so an empty list means none of
            them. Only the optional ones appear: the mandatory columns are the type's own contract, so
            listing them would let a response disagree with the schema the data source is written with.
          items:
            type: string
        columnOrder:
          type: array
          description: >
            Column ids in the order the user arranged the preview, or absent while they have not
            rearranged it. This is how the preview is read, not what the data source contains: the written
            table always carries the type's own column order, because that is what the ClicData template
            binds to. Absent rather than a full default list, so a column the order does not mention can
            fall in behind the ones it does.
          items:
            type: string
        filters:
          type: array
          description: Filters saved with the dashboard and applied to preview rows and ClicData source writes.
          items:
            $ref: '#/components/schemas/DashboardDatasetFilterV1'
        dateFrom:
          type: string
          format: date
          description: Inclusive first dataset date saved with the dashboard; absent means open-ended.
        dateTo:
          type: string
          format: date
          description: Inclusive last dataset date saved with the dashboard; absent means open-ended.
        sourceTable:
          type: string
          description: >
            The fully-qualified BigQuery table holding the data source, exactly as it must be typed into
            ClicData; absent while the dashboard is a draft.
        sourceRowCount:
          type: integer
          format: int64
          description: How many rows the last write put in `sourceTable`; absent while the dashboard is a draft.
        sourceCreated:
          type: string
          description: ISO-8601 timestamp of the last data-source write; absent while the dashboard is a draft.
        displayCampaignName:
          type: string
          description: >
            The campaign name as the dashboard should display it (US-020). Absent means nobody changed it,
            so the campaign's own name applies - it is kept separate because the Hub's name carries internal
            conventions a client-facing dashboard usually does not want.
        created:
          type: string
          description: ISO-8601 timestamp when the dashboard was created.
        edited:
          type: string
          description: ISO-8601 timestamp when the dashboard was last edited, or null if never edited since creation.
      required:
        - id
        - campaignId
        - name
        - type
        - status
        - optionalColumns
        - filters
        - created
    DashboardCreateV1:
      type: object
      description: >
        Data to create a dashboard. The campaign comes from the path; the id, status, and source fields are
        server-owned - a new dashboard is always a draft with no data source.
      properties:
        name:
          type: string
          maxLength: 50
          description: The dashboard name; validated non-empty, at most 50 characters, and unique within the campaign.
        type:
          $ref: '#/components/schemas/DashboardTypeEnumV1'
        optionalColumns:
          type: array
          description: >
            Ids of the type's optional columns to keep - exactly those, so an empty list means none of them.
            Required rather than defaulted: "kept nothing" and "did not say" would otherwise be the same
            request, and they produce different tables.
          items:
            type: string
        filters:
          type: array
          description: Filters to save with the dashboard and apply to preview rows and ClicData source writes.
          items:
            $ref: '#/components/schemas/DashboardDatasetFilterV1'
        dateFrom:
          type: string
          format: date
          description: Inclusive first dataset date to save with the dashboard; omit for open-ended.
        dateTo:
          type: string
          format: date
          description: Inclusive last dataset date to save with the dashboard; omit for open-ended.
        displayCampaignName:
          type: string
          description: The campaign name to display on the dashboard; omit to use the campaign's own name.
      required:
        - name
        - type
        - optionalColumns
    DashboardUpdateV1:
      type: object
      description: >
        Data to replace a dashboard's editable fields. The type is absent because it is the schema of a
        table ClicData may already be reading; the status and source fields are absent because they move
        only when a data source is created or removed.
      properties:
        name:
          type: string
          maxLength: 50
          description: The dashboard name; validated non-empty, at most 50 characters, and unique within the campaign.
        optionalColumns:
          type: array
          description: >
            Ids of the type's optional columns to keep - exactly those, so an empty list means none of them.
          items:
            type: string
        columnOrder:
          type: array
          description: >
            Column ids in the order to read the preview in. Saved on the drag itself rather than behind
            Apply: rearranging is a way of reading the dataset, not a change to what it contains.
          items:
            type: string
        filters:
          type: array
          description: Filters to save with the dashboard and apply to preview rows and ClicData source writes.
          items:
            $ref: '#/components/schemas/DashboardDatasetFilterV1'
        dateFrom:
          type: string
          format: date
          description: Inclusive first dataset date to save with the dashboard; omit for open-ended.
        dateTo:
          type: string
          format: date
          description: Inclusive last dataset date to save with the dashboard; omit for open-ended.
        displayCampaignName:
          type: string
          description: The campaign name to display on the dashboard; omit to use the campaign's own name.
      required:
        - name
        - optionalColumns
    DashboardPreviewV1:
      type: object
      description: What a dashboard's data source would contain if it were created now (US-019).
      properties:
        rowCount:
          type: integer
          format: int64
          description: How many rows the query returns today.
        optionalColumns:
          type: array
          description: >
            The optional columns the count was taken under, echoed back so the panel cannot show a figure
            beside a different column selection than the one it was measured with.
          items:
            type: string
        sourceTable:
          type: string
          description: The fully-qualified BigQuery table name the create-source action will replace.
      required:
        - rowCount
        - optionalColumns
        - sourceTable
    DashboardDatasetFilterV1:
      type: object
      description: Multi-value filter directive for one dashboard dataset output column.
      properties:
        field:
          type: string
          description: >
            Dashboard output column alias, spelled exactly as the written table spells it - for example
            Date, Channel, Impressions, or Line_Item_Description. Matched case-sensitively against the
            dashboard's own output columns, so a name differing only in case is rejected. These are the
            ClicData template's names rather than the Hub's own, since the written table is what a
            ClicData dashboard binds to.
        values:
          type: array
          description: Values accepted for that column.
          items:
            type: string
      required:
        - field
        - values
    DashboardDatasetRowsSearchRequestV1:
      type: object
      description: Filter criteria for the dashboard dataset preview table.
      properties:
        filters:
          type: array
          description: Filters applied additively (AND) to the dataset preview query.
          items:
            $ref: '#/components/schemas/DashboardDatasetFilterV1'
        dateFrom:
          type: string
          format: date
          description: Inclusive first dataset date for the preview query; omit for open-ended.
        dateTo:
          type: string
          format: date
          description: Inclusive last dataset date for the preview query; omit for open-ended.
    DashboardDatasetRowV1:
      type: object
      description: One dashboard dataset preview row, keyed by output column alias.
      properties:
        values:
          type: object
          additionalProperties: true
          description: Output column alias to value, in dashboard schema order.
      required:
        - values
    DashboardDatasetRowsPageResponseV1:
      description: A page of dashboard dataset preview rows.
      allOf:
        - $ref: '#/components/schemas/PageResponseV1'
        - type: object
          properties:
            content:
              type: array
              description: The dataset rows on this page.
              items:
                $ref: '#/components/schemas/DashboardDatasetRowV1'
          required:
            - content
    DashboardDataSourceRequestV1:
      type: object
      description: Confirmation of a data-source write, as the dialog in US-020 collects it.
      properties:
        displayCampaignName:
          type: string
          description: >
            The campaign name to show on the dashboard. Omit or leave blank to keep whatever the dashboard
            already carries - blank means "unchanged", not "clear it", because the dialog pre-fills the field
            and an empty dashboard title is never what someone meant.
    DashboardPageResponseV1:
      description: A page of a campaign's dashboards.
      allOf:
        - $ref: '#/components/schemas/PageResponseV1'
        - type: object
          properties:
            content:
              type: array
              description: The dashboards on this page.
              items:
                $ref: '#/components/schemas/DashboardV1'
          required:
            - content
    CampaignSortFieldEnumV1:
      type: string
      description: >
        Sortable fields of the campaign list. START_DATE and END_DATE are the campaign's flight, which it
        has no column for - a campaign is a group of insertion-order lines, so its start is the earliest
        among them and its end the latest. Omitting the sort entirely is not the same as sorting by either:
        the default orders by what is happening to each campaign - live, then upcoming, then finished.
      enum:
        - ID
        - NAME
        - CLIENT_ID
        - AGENCY_ID
        - STATUS
        - START_DATE
        - END_DATE
    CampaignFilterFieldEnumV1:
      type: string
      description: >
        Filterable fields of the campaign list. SEARCH is not a field but a free-text term matched
        against the campaign, client and agency name at once, so one search box finds a campaign by
        whichever of the three the user happens to know; CLIENT_NAME scopes by the effective reporting
        mart client name when an IO client id is not enough; SEARCH always matches as a
        case-insensitive substring, whatever operation and caseSensitive say.
      enum:
        - NAME
        - STATUS
        - CLIENT_ID
        - AGENCY_ID
        - CLIENT_NAME
        - SEARCH
    CampaignSortFieldV1:
      type: object
      description: Single-field sort directive for the campaign search.
      properties:
        field:
          $ref: '#/components/schemas/CampaignSortFieldEnumV1'
        direction:
          $ref: '#/components/schemas/DirectionEnumV1'
      required:
        - field
    CampaignFilterFieldV1:
      type: object
      description: Single-field filter directive for the campaign search.
      properties:
        field:
          $ref: '#/components/schemas/CampaignFilterFieldEnumV1'
        value:
          type: string
          description: The value matched against the field using the given operation.
        operation:
          $ref: '#/components/schemas/FilterOperationEnumV1'
        caseSensitive:
          type: boolean
          description: Whether the match is case-sensitive.
          default: false
      required:
        - field
        - value
        - operation
    CampaignSearchRequestV1:
      type: object
      description: Filter and sort criteria for searching campaigns.
      properties:
        filters:
          type: array
          description: >
            Filters applied additively (AND) to the campaign search, with one exception: several
            AGENCY_ID filters are OR-ed into a single IN, so a caller can filter by a set of agencies
            at once. (ANDing equality on the same id column would match nothing, so OR is the only
            sensible reading.) This never widens visibility - the resulting predicate still ANDs with
            the caller's own agency visibility, so the effective set is the intersection of the two.
          items:
            $ref: '#/components/schemas/CampaignFilterFieldV1'
        sorting:
          $ref: '#/components/schemas/CampaignSortFieldV1'
    CampaignPageResponseV1:
      description: A page of campaigns sourced from BigQuery.
      allOf:
        - $ref: '#/components/schemas/PageResponseV1'
        - type: object
          properties:
            content:
              type: array
              description: The campaigns on this page.
              items:
                $ref: '#/components/schemas/CampaignV1'
          required:
            - content
    TeamSearchRequestV1:
      type: object
      description: Criteria for the paginated team search.
      properties:
        name:
          type: string
          description: Case-insensitive substring matched against the team name.
    TeamPageResponseV1:
      description: A page of Hub teams.
      allOf:
        - $ref: '#/components/schemas/PageResponseV1'
        - type: object
          properties:
            content:
              type: array
              description: The teams on this page.
              items:
                $ref: '#/components/schemas/TeamV1'
          required:
            - content
    TeamV1:
      type: object
      description: A Hub team record.
      properties:
        id:
          type: integer
          format: int64
          description: The Hub team id.
        team_name:
          type: string
          description: The team name.
        pod_key:
          type: string
          description: The team pod key.
        status:
          type: string
          description: The team status.
        fromNetSuite:
          type: boolean
          description: Whether the team was synced from NetSuite. Such teams are read-only.
      required:
        - id
        - team_name
        - status
        - fromNetSuite
    CreateTeamRequestV1:
      type: object
      description: Data required to create a Hub team.
      properties:
        team_name:
          type: string
          description: The team name.
        pod_key:
          type: string
          description: The team pod key.
        status:
          type: string
          description: The team status.
      required:
        - team_name
        - status
    UpdateTeamRequestV1:
      type: object
      description: Data required to update a Hub team.
      properties:
        team_name:
          type: string
          description: The team name.
        pod_key:
          type: string
          description: The team pod key.
        status:
          type: string
          description: The team status.
      required:
        - team_name
        - status
