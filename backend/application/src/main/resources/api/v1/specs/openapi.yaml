    ReportRowAdjustmentRollbackRequestV1:
      type: object
      description: >
        The scope of a "Roll back adjustments" preview or rollback: which level-1 campaigns, within
        which inclusive delivery-date window. Never all-time - a rollback always names both bounds.
      properties:
        campaignConstructedNames:
          type: array
          description: >
            The level-1 constructed names (see ReportRowV1.line_item_name) to roll back adjustments for.
            Matched case-insensitively against the campaign's own resolved delivery scope; a name
            outside that scope fails the whole request. An empty selection is rejected rather than
            treated as "every campaign".
          minItems: 1
          # Kept equal to AdjustmentRollbackLimits.MAX_CAMPAIGN_NAMES (service module) by hand - the same
          # 500-value ceiling the report's own line_item_name dimension picker already enforces
          # (BigQueryReportRowService.DISTINCT_VALUES_LIMIT), so a rollback can never legitimately name
          # more level-1 campaigns than that picker could ever offer to select from.
          maxItems: 500
          items:
            type: string
            minLength: 1
        dateFrom:
          type: string
          format: date
          description: The inclusive first delivery/conversion date to roll back adjustments for.
        dateTo:
          type: string
          format: date
          description: The inclusive last delivery/conversion date to roll back adjustments for.
      required:
        - campaignConstructedNames
        - dateFrom
        - dateTo
    ReportRowAdjustmentRollbackResultV1:
      type: object
      description: >
        How many Hub-owned adjustment overlay rows a rollback removed (or, for a preview, would remove)
        from each of the two adjustment tables. A row counted here that has no matching base mart row
        (a manually-added line) disappears from the report entirely once removed, rather than falling
        back to a raw figure.
      properties:
        deliveryRowsRemoved:
          type: integer
          format: int64
          description: The number of delivery adjustment overlay rows removed (or that would be removed).
        conversionRowsRemoved:
          type: integer
          format: int64
          description: The number of conversions adjustment overlay rows removed (or that would be removed).
      required:
        - deliveryRowsRemoved
        - conversionRowsRemoved
