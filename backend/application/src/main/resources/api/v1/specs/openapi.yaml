        roles:
          type: array
          description: Distinct active role codes held by the user.
          items:
            type: string
        assignments:
          type: array
          description: Active role assignment views backing the effective access result.
          items:
            $ref: '#/components/schemas/RoleAssignmentV1'
      required:
        - user_id
        - email
    AgencyV1:
      type: object
      description: Representation of an agency sourced from BigQuery.
      properties:
        id:
          type: integer
          format: int64
          description: BigQuery agency id from the IO Lines source.
        name:
          type: string
          description: Agency company name.
        email:
          type: string
          description: Agency primary email (not available from BigQuery).
        status:
          type: string
          description: Agency lifecycle status.
        clientsCount:
          type: integer
          format: int64
          description: Number of distinct clients (advertisers) belonging to this agency in the IO Lines source.
        clients:
          type: array
          description: >
            The agency's clients (id and name only), populated only when the search request set
            includeClients=true. Null/absent for list/grid views that only need clientsCount.
          items:
            $ref: '#/components/schemas/AgencyClientV1'
