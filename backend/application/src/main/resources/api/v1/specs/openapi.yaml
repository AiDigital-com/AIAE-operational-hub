        - STATUS
        - AGENCY_ID
    ClientSortFieldV1:
      type: object
      description: Single-field sort directive for the client search.
      properties:
        field:
          $ref: '#/components/schemas/ClientSortFieldEnumV1'
        direction:
          $ref: '#/components/schemas/DirectionEnumV1'
      required:
        - field
    ClientFilterFieldV1:
      type: object
      description: Single-field filter directive for the client search.
      properties:
        field:
          $ref: '#/components/schemas/ClientFilterFieldEnumV1'
        value:
          type: string
          description: The value matched against the field using the given operation.
        operation:
          $ref: '#/components/schemas/FilterOperationEnumV1'
        caseSensitive:
          type: boolean
          description: Whether the match is case-sensitive.
          default: false
      required:
        - field
        - value
        - operation
    ClientSearchRequestV1:
      type: object
      description: Filter and sort criteria for searching clients.
      properties:
        filters:
          type: array
          description: Filters applied additively (AND) to the client search.
          items:
            $ref: '#/components/schemas/ClientFilterFieldV1'
        sorting:
          $ref: '#/components/schemas/ClientSortFieldV1'
    ClientPageResponseV1:
      description: A page of clients sourced from BigQuery.
      allOf:
        - $ref: '#/components/schemas/PageResponseV1'
        - type: object
          properties:
            content:
              type: array
              description: The clients on this page.
              items:
                $ref: '#/components/schemas/ClientV1'
          required:
            - content
    CampaignV1:
      type: object
      description: Representation of a campaign sourced from BigQuery.
      properties:
        id:
          type: integer
          format: int64
          description: BigQuery campaign id.
        name:
          type: string
          description: Campaign name.
        client_id:
          type: integer
          format: int64
          description: BigQuery advertiser/client id, or null.
        client_name:
          type: string
          description: Advertiser/client name, or null.
        agency_id:
          type: integer
          format: int64
          description: BigQuery agency id, or null.
        agency_name:
          type: string
          description: Agency name, or null.
        status:
          type: string
          description: Campaign status (e.g. Finished, To Be Launched).
        start_date:
          type: string
          description: Campaign flight start date (ISO format), or null.
        end_date:
          type: string
          description: Campaign flight end date (ISO format), or null.
        budget:
          type: number
          format: double
          description: Total campaign budget, or null.
        channels:
          type: array
          description: Distinct media tactics / channels.
          items:
            type: string
        industry_vertical:
          type: string
          description: The client's industry / vertical (e.g. Automotive), or null.
        line_item_count:
          type: integer
          format: int64
          description: The campaign's distinct line-item count, or null.
      required:
        - id
        - name
    InsertionOrderV1:
      type: object
      description: >
        One real NetSuite insertion order and its line items, sourced from the IO Lines table
        (US-009…011).
      properties:
        order_id:
          type: integer
          format: int64
          description: BigQuery order id - the insertion order's identity.
        order_number:
          type: string
          description: The order's human-readable number, or null.
        status:
          type: string
          description: The order's real NetSuite status (e.g. Live, Finished), or null.
        start_date:
          type: string
          description: The order's flight start date (ISO format), or null.
        end_date:
          type: string
          description: The order's flight end date (ISO format), or null.
        budget:
          type: number
          format: double
          description: The order's own budget, read once per order - never a per-row sum, or null.
        media_tactics:
          type: array
          description: The order's line items' distinct media tactics, in first-seen order.
          items:
            type: string
        line_items:
          type: array
          description: The order's real line items, in line_item_id order.
          items:
            $ref: '#/components/schemas/InsertionOrderLineItemV1'
      required:
        - order_id
    InsertionOrderLineItemV1:
      type: object
      description: >
        One real NetSuite line item within an insertion order. There is no per-line-item status in the
        source - a line item's status is its parent order's.
      properties:
        line_item_id:
          type: integer
          format: int64
          description: BigQuery line item id - the line item's identity.
        description:
          type: string
          description: The line item's free-form description, or null.
        media_tactic:
          type: string
          description: The line item's media tactic / channel, or null.
        rate_type:
          type: string
          description: The line item's rate type, or null.
        budget:
          type: number
          format: double
          description: The line item's own tactic budget, or null.
        start_date:
          type: string
          description: The line item's flight start date (ISO format), or null.
        end_date:
          type: string
          description: The line item's flight end date (ISO format), or null.
      required:
        - line_item_id
    ReportRowFilterFieldEnumV1:
      type: string
      description: >
        The report-rows table's dimension vocabulary - the columns a row can be filtered by and grouped
        by (see ReportRowSearchRequestV1's `filters` and `groupBy`). Metrics are absent: they are
        aggregated rather than grouped, and are only sortable (see ReportRowSortFieldEnumV1).
      enum:
        - DATE
        - PLATFORM
        - ACCOUNT
        - ACCOUNT_ID
        - LINE_ITEM_NAME
        - LINE_ITEM_ID
        - INSERTION_ORDER_NAME
        - INSERTION_ORDER_ID
        - CAMPAIGN_CONSTRUCTED_NAME
        - CAMPAIGN_CONSTRUCTED_ID
        - AGENCY_ID
        - CLIENT
        - INDUSTRY_CODE
        - CAMPAIGN_NAME
        - CHANNEL
        - TACTIC
        - BUYING_MODEL
        - AUDIENCE
        - UNIQUE_LINE_ITEM_ID
        - OTHER
        - GEO
        - CREATIVE_TAG
        - MESSAGE
        - KEYWORD_GROUP
        - FLIGHT_IDENTIFIER
        - LANGUAGE
        - ADJUSTED_METRICS
        - RATE_TYPE
        - LINE_ITEM_DESCRIPTION
        - CREATED_AT
        - CREATED_BY
        - LAST_MODIFIED_AT
        - LAST_MODIFIED_BY
    ReportRowFilterV1:
      type: object
      description: >
        Multi-value filter directive for one report-rows dimension - a row matches when its value for
        `field` is any of `values` (IN). Distinct from the other entities' single-value filter shape
        since the report-rows filter picker lets a user select several values for the same dimension at
        once (see the mockup's checkbox-list filter popovers).
      properties:
        field:
          $ref: '#/components/schemas/ReportRowFilterFieldEnumV1'
        values:
          type: array
          items:
            type: string
          description: The dimension's values to match - a row matches when its value is any of these.
      required:
        - field
        - values
    ConversionRowSearchRequestV1:
      type: object
      description: >
        The conversion-date window for the conversions template. A window and nothing else: the
        conversions read is scoped by campaign and date only, deliberately. The report's dimension
        filters describe delivery rows, and the two marts are filled by different pipelines, so a
        channel or audience filter could exclude the conversions row belonging to a delivery row the
        same filter keeps.
      properties:
        dateFrom:
          type: string
          format: date
          description: Inclusive first conversion date to include, as yyyy-MM-dd. Omit for open-ended.
        dateTo:
          type: string
          format: date
          description: Inclusive last conversion date to include, as yyyy-MM-dd. Omit for open-ended.
    ConversionBreakdownRequestV1:
      type: object
      description: >
        Names the report row whose Conversions cell is being opened. These are the columns the report
        joins conversions on, which is why they and not the row's other columns identify it. `channel`
        is not a filter: it decides whether level 3 narrows the match at all, since the report drops
        level 3 for channels that report conversions against the campaign.
      properties:
        date:
          type: string
          format: date
          description: The report row's date, as yyyy-MM-dd.
        levelOneName:
          type: string
          description: The report row's level-1 constructed name.
        levelThreeName:
          type: string
          description: The report row's level-3 constructed name; omit when the row has none.
        channel:
          type: string
          description: The report row's channel.
      required:
        - date
        - levelOneName
    ConversionBreakdownV1:
      type: object
      description: The conversions rows behind one report row's Conversions cell.
      properties:
        rows:
          type: array
          description: One row per conversion action, ordered by action. Their figures sum to the cell.
          items:
            $ref: '#/components/schemas/ConversionBreakdownRowV1'
      required:
        - rows
    ConversionBreakdownRowV1:
      type: object
      description: >
        One conversions row: what identifies it, what it is called, and the figure. The first six
        properties are its identity - the same key an edited row is matched back by - and the names are
        there to be read, never to match on.
      properties:
        date:
          type: string
          description: The conversion date, as the mart stores it.
        lineItemId:
          type: string
          description: The level-1 constructed id.
        insertionOrderId:
          type: string
          description: The level-2 constructed id.
        creativeId:
          type: string
          description: The level-3 constructed id.
        conversionAction:
          type: string
          description: The advertiser's own name for what was counted.
        conversionCategory:
          type: string
          description: The platform's classification of that action.
        lineItemName:
          type: string
          description: The level-1 constructed name.
        creativeName:
          type: string
          description: The level-3 constructed name.
        platform:
          type: string
          description: The platform the conversions were reported by.
        conversions:
          type: number
          format: double
          description: The conversions counted for this action.
      required:
        - date
    ConversionAdjustmentRequestV1:
      type: object
      description: >
        Conversions rows edited in place. Each carries the identity it was read with and the figure the
        user wants; rows whose figure is unchanged may be sent and are skipped rather than rewritten.
      properties:
        rows:
          type: array
          description: The edited rows.
          items:
            $ref: '#/components/schemas/ConversionAdjustmentRowV1'
      required:
        - rows
    ConversionAdjustmentRowV1:
      type: object
      description: >
        One edited conversions row: the key it is matched by, and the new figure. Only the key is sent
        back, not the names - the names follow from the ids, and the values actually stored are taken
        from the matched mart row, never from the request.
      properties:
        date:
          type: string
          description: The conversion date, as returned by the breakdown.
        lineItemId:
          type: string
          description: The level-1 constructed id.
        insertionOrderId:
          type: string
          description: The level-2 constructed id.
        creativeId:
          type: string
          description: The level-3 constructed id.
        conversionAction:
          type: string
          description: The advertiser's own name for what was counted.
        conversionCategory:
          type: string
          description: The platform's classification of that action.
        conversions:
          type: number
          format: double
          description: The figure to store for this row.
      required:
        - date
        - conversions
    ReportRowSearchRequestV1:
      type: object
      description: Filter and sort criteria for the report-rows table.
      properties:
        filters:
          type: array
          description: >
            Multi-value dimension filters applied additively (AND); within one filter, values match by
            OR (IN).
          items:
            $ref: '#/components/schemas/ReportRowFilterV1'
        sortField:
          $ref: '#/components/schemas/ReportRowSortFieldEnumV1'
        sortDirection:
          $ref: '#/components/schemas/DirectionEnumV1'
        groupBy:
          type: array
          description: >
            Dimensions to group the rows by, in display order - one row per distinct combination, with
            every metric aggregated over it (counts and money summed, stored rates averaged). Empty or
            omitted returns the raw, ungrouped rows. Dimensions outside this list are not selected and
            come back null. Honored by the export too, so a current-view download matches the table
            row for row; ignored only by the bulk-adjustment template, whose rows must stay raw to be
            matched back on upload. Distinct from `dimensions` below, which only narrows an export's
            columns.
          items:
            $ref: '#/components/schemas/ReportRowFilterFieldEnumV1'
        dateFrom:
          type: string
          format: date
          description: >
            Inclusive first delivery date to include, as yyyy-MM-dd. Omit for open-ended. A window
            rather than a `filters` entry because dates do not suit naming every value to keep: a
            quarter would be ninety of them, and the distinct-value list a picker draws from is capped,
            so a long flight could not offer them all.
        dateTo:
          type: string
          format: date
          description: Inclusive last delivery date to include, as yyyy-MM-dd. Omit for open-ended.
        dimensions:
          type: array
          description: Optional dimension column ids to include in a current-view .xlsx export.
          items:
            type: string
        metrics:
          type: array
          description: Optional metric column ids to include in a current-view .xlsx export.
          items:
            type: string
        columnOrder:
          type: array
          description: >
            The order the export's columns are written in, as dimension and metric ids in one
            interleaved list. Narrows nothing - `dimensions` and `metrics` above still decide which
            columns are included; this decides only where each one sits. Needed because those two
            fields cannot express a metric sitting between two dimensions, which the report view can:
            concatenating them always yields every dimension and then every metric.

            Send a fully resolved order - every included id, in the order they are to be written. Ids
            here that are not included are ignored, and an included id left out is written after the
            ones named here. That trailing rule is a fallback for a partial list, not a placement rule:
            a caller matching a screen resolves its own gaps first, because only the caller knows where
            an unplaced column sits there. Omit for the default order, every dimension then every metric.
          items:
            type: string
