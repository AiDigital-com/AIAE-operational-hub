              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '404':
          description: The campaign was not found, or is not visible to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while deleting adjustments from BigQuery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
