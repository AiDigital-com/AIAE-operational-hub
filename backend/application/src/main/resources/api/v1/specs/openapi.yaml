openapi: 3.0.3
info:
  title: AIAE Operational Hub API
  version: "1"
  description: >
    Backend API for AI Digital Operational Hub RBAC foundation. Authentication is Clerk SSO;
    the backend validates Clerk-issued JWTs against Clerk JWKS. OpenAPI is the source of truth
    for all exposed REST endpoints.
servers:
  - url: /
    description: Endpoint paths are fully qualified under /api/v1.
security:
  - bearerAuth: [ ]
tags:
  - name: auth
    description: Everything needed to resolve the authenticated user and effective access.
  - name: rbac
    description: Everything needed to manage RBAC role assignments.
  - name: dictionary
    description: Read-only reference dictionaries, including the RBAC role and scope-type catalogs.
  - name: agencies
    description: Read-only access to agencies sourced from BigQuery, filtered by RBAC scope.
  - name: clients
    description: Read-only access to clients sourced from BigQuery, filtered by RBAC scope.
  - name: campaigns
    description: Read-only access to campaigns sourced from BigQuery, optionally filtered by client or agency.
  - name: teams
    description: Admin-only management of Hub teams.
paths:
  /api/v1/auth/me:
    get:
      tags:
        - auth
      operationId: getCurrentUser
      description: Returns the authenticated Hub user with active role assignments and effective RBAC access.
      responses:
        '200':
          description: Authenticated Hub user was resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV1'
              examples:
                authenticatedUser:
                  value:
                    user_id: user_123
                    email: demo-user@example.com
                    full_name: Demo User
                    hub_user_id: 42
                    status: ACTIVE
                    roles:
                      - ADMIN
                    assignments:
                      - id: 7
                        user_id: 42
                        role_code: ADMIN
                        scope_code: ALL
                        scope_id: null
                        status: ACTIVE
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while resolving current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/dictionary/rbac/roles:
    get:
      tags:
        - dictionary
      operationId: listRoles
      description: Lists active RBAC role dictionary rows. Requires manage-roles permission.
      responses:
        '200':
          description: Active role dictionary rows were found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while loading role dictionary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/dictionary/rbac/scope-types:
    get:
      tags:
        - dictionary
      operationId: listScopeTypes
      description: Lists active RBAC scope-type dictionary rows. Requires manage-roles permission.
      responses:
        '200':
          description: Active scope-type dictionary rows were found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScopeTypeV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while loading scope-type dictionary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/dictionary/statuses:
    get:
      tags:
        - dictionary
      operationId: listStatuses
      description: Lists the lifecycle status dictionary used by the user-management filters. Requires manage-roles permission.
      responses:
        '200':
          description: Status dictionary rows were returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while loading the status dictionary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/rbac/users/search:
    post:
      tags:
        - rbac
      operationId: searchUsers
      description: >
        Searches Hub users with their single active role, backing the user-management table.
        Sorting and filtering are applied server-side; results are paginated. Requires manage-roles permission.
      parameters:
        - $ref: '#/components/parameters/PageNumberParam'
        - $ref: '#/components/parameters/PageSizeParam'
      requestBody:
        description: Filter and sort criteria for the user search.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubUserSearchRequestV1'
      responses:
        '200':
          description: A page of Hub users was resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubUserPageResponseV1'
        '400':
          description: The paging parameters or search criteria failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while searching users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/rbac/users/{userId}/role-assignments:
    get:
      tags:
        - rbac
      operationId: listRoleAssignments
      description: Lists active role assignments for the specified Hub user. Requires manage-roles permission.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The hub_users.id of the user whose active assignments should be returned.
      responses:
        '200':
          description: Active role assignments were found for the specified user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleAssignmentV1'
        '400':
          description: The specified userId parameter has invalid type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while loading role assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
    post:
      tags:
        - rbac
      operationId: assignRole
      description: Assigns a role to the specified Hub user within the requested scope. Requires manage-roles permission.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The hub_users.id of the target user receiving the role assignment.
      requestBody:
        description: Role assignment request body.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequestV1'
      responses:
        '201':
          description: The role assignment was created, or an equivalent active assignment already existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentV1'
        '400':
          description: Validation errors of incoming DTO or RBAC business-rule errors occurred.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
                  - $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '404':
          description: Target Hub user was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while assigning the role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/rbac/users/{userId}/role-assignments/{assignmentId}:
    delete:
      tags:
        - rbac
      operationId: revokeRole
      description: Revokes an active role assignment for the specified Hub user. Requires manage-roles permission.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The hub_users.id of the target user whose assignment should be revoked.
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The hub_role_assignments.id of the assignment to revoke.
      responses:
        '204':
          description: Assignment was revoked or was already absent.
        '400':
          description: The specified userId or assignmentId parameter has invalid type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while revoking the role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/agencies/search:
    post:
      tags:
        - agencies
      operationId: searchAgencies
      description: >
        Searches the agencies visible to the authenticated user, sourced from BigQuery and filtered by RBAC scope.
        Sorting and filtering are applied server-side; results are paginated.
      parameters:
        - $ref: '#/components/parameters/PageNumberParam'
        - $ref: '#/components/parameters/PageSizeParam'
      requestBody:
        description: Filter and sort criteria for the agency search.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencySearchRequestV1'
      responses:
        '200':
          description: A page of visible agencies was resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyPageResponseV1'
        '400':
          description: The paging parameters or search criteria failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while reading agencies from BigQuery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/clients/search:
    post:
      tags:
        - clients
      operationId: searchClients
      description: >
        Searches the clients visible to the authenticated user, sourced from BigQuery and filtered by RBAC scope.
        Sorting and filtering are applied server-side; results are paginated.
      parameters:
        - $ref: '#/components/parameters/PageNumberParam'
        - $ref: '#/components/parameters/PageSizeParam'
      requestBody:
        description: Filter and sort criteria for the client search.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSearchRequestV1'
      responses:
        '200':
          description: A page of visible clients was resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPageResponseV1'
        '400':
          description: The paging parameters or search criteria failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while reading clients from BigQuery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/campaigns/search:
    post:
      tags:
        - campaigns
      operationId: searchCampaigns
      description: >
        Searches campaigns visible to the authenticated user, sourced from BigQuery.
        Optionally filtered by client_id or agency_id. Sorting and paging are applied server-side.
      parameters:
        - $ref: '#/components/parameters/PageNumberParam'
        - $ref: '#/components/parameters/PageSizeParam'
      requestBody:
        description: Filter and sort criteria for the campaign search.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignSearchRequestV1'
      responses:
        '200':
          description: A page of campaigns was resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPageResponseV1'
        '400':
          description: The paging parameters or search criteria failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while reading campaigns from BigQuery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/campaigns/{campaignId}:
    get:
      tags:
        - campaigns
      operationId: getCampaign
      description: >
        Returns one campaign by id, sourced from the netsuite_campaigns_with_ids_fresh_data BigQuery
        table, enforcing the current user's agency visibility (a campaign outside it resolves the same
        as an unknown one). Lets the campaign workspace be opened directly - by a pasted link, a
        bookmark, or a restored tab - instead of only from a list that carries the campaign along.
      parameters:
        - name: campaignId
          in: path
          required: true
          description: The campaign id.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The campaign was resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '404':
          description: The campaign was not found, or is not visible to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while reading the campaign from BigQuery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/campaigns/{campaignId}/report-rows:
    post:
      tags:
        - campaigns
      operationId: listCampaignReportRows
      description: >
        Returns one page of per-day, per-line-item delivery/actuals rows for one campaign, sourced from
        the platform_mart_adjustments_view_op_hub BigQuery view (merges base platform_mart delivery
        data with manual op-hub adjustments; conflicts resolve by latest last_modified_at
        server-side). Metric totals and the date range / distinct line item count are always computed
        over every matching row that matches the requested filters, not just the returned page, so they
        stay stable while more pages load. POST (not GET) because the filter set is a variable-length
        list of multi-value dimension filters - the same shape /campaigns/search already uses.
      parameters:
        - name: campaignId
          in: path
          required: true
          description: The campaign id.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/PageNumberParam'
        - $ref: '#/components/parameters/PageSizeParam'
      requestBody:
        description: Filter and sort criteria for the report rows.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRowSearchRequestV1'
      responses:
        '200':
          description: A page of the campaign's report rows was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRowsPageResponseV1'
        '400':
          description: The paging parameters or filter/sort criteria failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '404':
          description: The campaign was not found, or is not visible to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while reading report rows from BigQuery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/campaigns/{campaignId}/report-rows/distinct-values:
    get:
      tags:
        - campaigns
      operationId: listReportRowDistinctValues
      description: >
        Returns the distinct, non-null values of one report-rows dimension for one campaign, sourced
        from the same platform_mart_adjustments_view_op_hub rows the report-rows endpoint reads - used
        to populate a column's filter picker. Capped at 500 values; metrics are not filterable (see
        ReportRowFilterFieldEnumV1).
      parameters:
        - name: campaignId
          in: path
          required: true
          description: The campaign id.
          schema:
            type: integer
            format: int64
        - name: field
          in: query
          required: true
          description: The dimension to list distinct values for.
          schema:
            $ref: '#/components/schemas/ReportRowFilterFieldEnumV1'
      responses:
        '200':
          description: The dimension's distinct values were found.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: The field parameter failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '404':
          description: The campaign was not found, or is not visible to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while reading distinct values from BigQuery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/campaigns/{campaignId}/report-rows/constructed-entities:
    get:
      tags:
        - campaigns
      operationId: listConstructedEntities
      description: >
        Resolves one constructed-name level's typed name against the campaign's own mart data (PDI_117
        Add Line mode A - the user still types the name; the Hub resolves it to a real entity instead of
        letting the user type its id). A name can carry several distinct platform ids
        (constructed_name -> constructed_id is one-to-many), so a match also carries the delivery-date
        range and impressions a disambiguation popover needs to tell them apart when more than one comes
        back. Sourced from the same platform_mart_adjustments_view_op_hub rows the report-rows endpoint
        reads, scoped to this campaign.
      parameters:
        - name: campaignId
          in: path
          required: true
          description: The campaign id.
          schema:
            type: integer
            format: int64
        - name: level
          in: query
          required: true
          description: The constructed-name level to resolve the name at.
          schema:
            $ref: '#/components/schemas/ConstructedEntityLevelEnumV1'
        - name: platform
          in: query
          required: false
          description: Narrows results to one delivery platform.
          schema:
            type: string
            maxLength: 200
        - name: accountId
          in: query
          required: false
          description: Narrows results to one platform account id.
          schema:
            type: string
            maxLength: 200
        - name: name
          in: query
          required: false
          description: The exact constructed name (as typed in the added row's cell) to resolve.
          schema:
            type: string
            maxLength: 500
        - $ref: '#/components/parameters/PageNumberParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: A page of the level's constructed entities was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructedEntityPageResponseV1'
        '400':
          description: The level or paging parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '404':
          description: The campaign was not found, or is not visible to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while reading constructed entities from BigQuery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/campaigns/{campaignId}/report-rows/constructed-ids/preview:
    post:
      tags:
        - campaigns
      operationId: previewConstructedIds
      description: >
        Previews the deterministic, OPH_-namespaced constructed ids Add Line mode B ("line is not present
        in platform data") would generate for the given names, without writing anything, so the UI can
        show the generated id before Save. saveReportRowAdjustments re-derives the same ids server-side
        for every added row regardless of what the client sends - this endpoint is a convenience read, not
        the authority.
      parameters:
        - name: campaignId
          in: path
          required: true
          description: The campaign id.
          schema:
            type: integer
            format: int64
      requestBody:
        description: The names to preview generated ids for.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstructedIdsPreviewRequestV1'
      responses:
        '200':
          description: The preview was computed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructedIdsPreviewResponseV1'
        '400':
          description: The request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '404':
          description: The campaign was not found, or is not visible to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
        '500':
          description: Exception occurred while computing the preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubApiExceptionResponseV1'
  /api/v1/campaigns/{campaignId}/report-rows/adjustments:
    post:
      tags:
        - campaigns
      operationId: saveReportRowAdjustments
      description: >
        Appends one or more report-row adjustments (inline metric edits and/or manually-added rows) for
        one campaign - each is written as a new, append-only row to the adjustments write table, stamped
        with the current user and a server-authoritative timestamp, so the report-rows read view merges
        it over the base data (latest last-modified timestamp wins). A single inline cell edit is a
        batch of one; a bulk adjustment is a batch of many - both use this same endpoint.
      parameters:
        - name: campaignId
          in: path
          required: true
          description: The campaign id.
          schema:
            type: integer
            format: int64
      requestBody:
        description: The adjustments to append.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRowAdjustmentsRequestV1'
      responses:
        '204':
          description: The adjustments were written.
        '400':
          description: The adjustments payload failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHubValidationExceptionResponseV1'
        '401':
          description: The authorization token not provided or expired.
        '403':
          description: The authorization token not correct or user not authorized.
