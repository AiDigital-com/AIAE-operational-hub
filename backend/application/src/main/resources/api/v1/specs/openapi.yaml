        - NAME
        - EMAIL
        - STATUS
        - CLIENTS_COUNT
    AgencyFilterFieldEnumV1:
      type: string
      description: Filterable fields of the agency list.
      enum:
        - NAME
        - EMAIL
        - STATUS
    AgencySortFieldV1:
      type: object
      description: Single-field sort directive for the agency search.
      properties:
        field:
          $ref: '#/components/schemas/AgencySortFieldEnumV1'
        direction:
          $ref: '#/components/schemas/DirectionEnumV1'
      required:
        - field
    AgencyFilterFieldV1:
      type: object
      description: Single-field filter directive for the agency search.
      properties:
        field:
          $ref: '#/components/schemas/AgencyFilterFieldEnumV1'
        value:
          type: string
          description: The value matched against the field using the given operation.
        operation:
          $ref: '#/components/schemas/FilterOperationEnumV1'
        caseSensitive:
          type: boolean
          description: Whether the match is case-sensitive.
          default: false
      required:
        - field
        - value
        - operation
    AgencySearchRequestV1:
      type: object
      description: Filter and sort criteria for searching agencies.
      properties:
        filters:
          type: array
          description: Filters applied additively (AND) to the agency search.
          items:
            $ref: '#/components/schemas/AgencyFilterFieldV1'
        sorting:
          $ref: '#/components/schemas/AgencySortFieldV1'
        search:
          type: string
          description: >
            Optional global search term. The server matches agencies whose name contains the term
            (case-insensitive) OR that have at least one client (advertiser) whose name contains
            the term. Blank or omitted values disable global search and behave as before.
            Combined additively (AND) with any explicit `filters` and with the caller's RBAC scope.
          maxLength: 200
        includeClients:
          type: boolean
          description: >
            When true, each returned agency is populated with its clients (id and name) so the
            navigation sidebar can render client sub-rows without a follow-up request. Omitted or
            false for list/grid views that only need the client count. When `search` matches a
            client name only (the agency name does not match), the embedded client list contains
            only the clients whose names match the term; otherwise the first page of clients is
            embedded as usual.
    AgencyPageResponseV1:
      description: A page of agencies sourced from BigQuery.
      allOf:
        - $ref: '#/components/schemas/PageResponseV1'
        - type: object
          properties:
            content:
              type: array
              description: The agencies on this page.
              items:
                $ref: '#/components/schemas/AgencyV1'
          required:
            - content
    ClientSortFieldEnumV1:
      type: string
      description: Sortable fields of the client list.
      enum:
