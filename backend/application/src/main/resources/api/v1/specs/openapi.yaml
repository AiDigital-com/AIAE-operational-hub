components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued JWT bearer token validated against Clerk JWKS.
  parameters:
    PageNumberParam:
      name: pageNumber
      in: query
      required: false
      description: One-based page number to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    SyncSummaryV1:
      type: object
      description: Summary of a NetSuite/Rippling sync run.
      properties:
        teams:
          type: integer
          format: int32
          description: Number of distinct teams (departments) ensured.
        users:
          type: integer
          format: int32
          description: Number of users upserted from active employees.
        assignmentsUpdated:
          type: integer
          format: int32
          description: Number of team role assignments created or changed.
        agenciesMapped:
          type: integer
          format: int32
          description: Number of agencies mapped to a team via their MPO team lead.
      required:
        - teams
        - users
        - assignmentsUpdated
        - agenciesMapped
    UserV1:
      type: object
      description: Representation of the authenticated Hub user and effective access.
      properties:
        user_id:
          type: string
          description: Stable Clerk user id from the JWT subject claim.
        email:
          type: string
          format: email
          description: Authenticated user's primary email address.
        full_name:
          type: string
          description: Authenticated user's display name from Clerk claims.
        hub_user_id:
          type: integer
          format: int64
          description: Internal hub_users.id mapped to the Clerk user.
        status:
          type: string
