          description: The timestamp exception occurred.
        correlationId:
          type: string
          description: The log stream UUID.
      required:
        - errors
        - timestamp
        - correlationId
    FieldToErrorResponseV1:
      type: object
      description: Representation of validation error bound to a field or semantic request part.
      properties:
        code:
          type: string
          description: The code of validation error occurred.
        field:
          type: string
          description: The field or semantic request part not passed validation.
        error:
          type: string
          description: The validation error occurred.
      required:
        - code
        - field
        - error
    OperationalHubApiExceptionResponseV1:
      type: object
      description: Representation of exception occurred in REST API format.
      properties:
        code:
          type: string
          description: The code of exception occurred.
        message:
          type: string
          description: The message of exception occurred.
        timestamp:
          type: string
          format: date-time
          description: The timestamp exception occurred.
        correlationId:
          type: string
          description: The log stream UUID.
      required:
        - code
        - message
        - timestamp
        - correlationId
    DirectionEnumV1:
      type: string
      description: Sort direction applied to a single sortable field.
      enum:
        - ASC
        - DESC
      default: ASC
    FilterOperationEnumV1:
      type: string
      description: >
        Operation used to match a filter value against a field. CONTAINS performs a substring
        match (used for free-text columns); EQUALS performs an exact match (used for code or
        enumerated columns).
      enum:
        - CONTAINS
        - EQUALS
    PageResponseV1:
      type: object
      description: Base pagination metadata shared by all paged responses.
      properties:
        pageNumber:
          type: integer
          format: int32
          description: One-based number of the returned page.
        pageSize:
          type: integer
          format: int32
          description: Maximum number of items per page.
        totalElements:
          type: integer
          format: int64
          description: Total number of items matching the query across all pages.
        totalPages:
          type: integer
          format: int32
          description: Total number of pages available for the query.
      required:
        - pageNumber
        - pageSize
        - totalElements
        - totalPages
    HubUserSortFieldEnumV1:
      type: string
      description: >
        Sortable fields of the user-management table. The active role code is filterable but not
        sortable, as it is resolved through a separate role-assignment lookup.
      enum:
        - HUB_USER_ID
        - FULL_NAME
        - EMAIL
        - STATUS
    HubUserFilterFieldEnumV1:
      type: string
      description: Filterable fields of the user-management table.
      enum:
        - HUB_USER_ID
        - FULL_NAME
        - EMAIL
        - STATUS
        - ROLE_CODE
    HubUserSortFieldV1:
      type: object
      description: Single-field sort directive for the user search.
      properties:
        field:
          $ref: '#/components/schemas/HubUserSortFieldEnumV1'
        direction:
          $ref: '#/components/schemas/DirectionEnumV1'
      required:
        - field
    HubUserFilterFieldV1:
      type: object
      description: Single-field filter directive for the user search.
      properties:
        field:
          $ref: '#/components/schemas/HubUserFilterFieldEnumV1'
        value:
          type: string
          description: The value matched against the field using the given operation.
        operation:
          $ref: '#/components/schemas/FilterOperationEnumV1'
        caseSensitive:
          type: boolean
          description: Whether the match is case-sensitive.
          default: false
