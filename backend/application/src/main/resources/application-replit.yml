server:
  port: ${PORT:5000}
  # Without this a redeploy kills the JVM immediately, severing any in-flight request (e.g. a large
  # report export) mid-response. Timeout set just past the BigQuery job budget (30s, see
  # BigQueryProperties#jobTimeoutMs) so an in-flight BQ-backed request gets a chance to finish first.
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 35s
  # Reserved VM cold-start is slow — Liquibase + Hibernate + JPA scanning
  # routinely push first-bind past the deployment's port-check window
  # (~30s), so the container gets killed before Tomcat ever opens 5000.
  # Lazy-init defers most beans until first request, letting Tomcat bind
  # within ~10s. Trade-off: first request to a controller is ~1-2s slower.
  main:
    lazy-initialization: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        # Skip Hibernate's slow JDBC metadata round-trip at startup
        # (multi-second on cold Reserved VM). Required pairing: an
        # explicit dialect above, otherwise Hibernate fails with
        # "Unable to determine Dialect without JDBC metadata".
        boot.allow_jdbc_metadata_access: false
        temp.use_jdbc_metadata_defaults: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://${PGHOST:${POSTGRES_HOST:localhost}}:${PGPORT:${POSTGRES_PORT:5432}}/${PGDATABASE:${POSTGRES_DB:app}}
    username: ${PGUSER:${POSTGRES_USER:app}}
    password: ${PGPASSWORD:${POSTGRES_PASSWORD:app}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      idle-timeout: 10000
      connection-timeout: 10000
      leak-detection-threshold: 20000
      auto-commit: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

springdoc:
  swagger-ui:
    persist-authorization: true

app:
  auth:
    allowed-email-domain: ${AUTH_ALLOWED_EMAIL_DOMAIN:aidigital.com}
    publishable-key: ${CLERK_PUBLISHABLE_KEY:}
    authorized-parties: ${AUTH_AUTHORIZED_PARTIES:}
    sso:
      issuer-uri: ${AUTH_ISSUER_URI:}
      jwk-set-uri: ${AUTH_JWKS_URI:}
      audience: ${AUTH_AUDIENCE:}

management:
  # Splits /actuator/health into readiness/liveness groups so the deploy's port-check/health probe can
  # gate traffic on actual startup completion instead of just "the port is open" (lazy-init above means
  # the port opens well before beans finish initializing).
  health:
    probes:
      enabled: true

oph:
  cache:
    warmup-enabled: false

logging:
  level:
    # Base application.yml defaults this to TRACE (dev-friendly full request/response body logging).
    # In this deployed profile, default to INFO instead so bodies aren't logged unless explicitly
    # re-enabled for a one-off debugging session via the LOGBOOK_LEVEL env var.
    org.zalando.logbook: ${LOGBOOK_LEVEL:INFO}